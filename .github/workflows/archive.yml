name: Twitch Archive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yt-dlp
        run: pip install -U yt-dlp

      - name: Install TwitchDownloaderCLI
        run: |
          VERSION=$(curl -s https://api.github.com/repos/lay295/TwitchDownloader/releases/latest | grep tag_name | cut -d '"' -f 4)
          FILE="TwitchDownloaderCLI-${VERSION}-Linux-x64.zip"
          wget https://github.com/lay295/TwitchDownloader/releases/download/${VERSION}/${FILE}
          unzip ${FILE}
          chmod +x TwitchDownloaderCLI
          sudo mv TwitchDownloaderCLI /usr/local/bin/TwitchDownloaderCLI

      - name: Write cookies file
        run: echo "${{ secrets.TWITCH_COOKIES }}" > cookies.txt

      - name: Run fetch script
        run: python scripts/fetch_vods.py

      - name: Normalize chats
        run: python scripts/normalize_chat.py

      - name: Commit only archive data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "Archive Twitch VODs" || echo "No changes"
          git push
